<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0" th:text="'Transaction History : ' + ${customer.fullName} + ' (' + ${customer.accountNumber} + ')'"></h4>
            <a th:href="@{/}" class="btn btn-light btn-sm">Back to Dashboard</a>
        </div>
        <div class="card-body">
            <h5 class="text-end mb-4">Current Balance: <span class="text-success fw-bold" th:text="'Rs. ' + ${customer.balance}"></span></h5>
            <h4>Total Amount Sent: LKR <span th:text="${totalSent != null ? totalSent : '0.00'}">0.00</span></h4>
            <table class="table table-bordered text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Date & Time</th>
                        <th>From Account</th>
                        <th>To Account</th>
                        <th>Amount (Rs)</th>
                        <th>Status</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tx : ${transactions}">
                        <td th:text="${#temporals.format(tx.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                        <td th:text="${tx.fromAccount}"></td>
                        <td th:text="${tx.toAccount}"></td>
                        <td th:text="${tx.amount}" class="fw-bold"></td>
                        <td>
                            <span th:if="${tx.status.name() == 'SUCCESS'}" class="badge bg-success">SUCCESS</span>
                            <span th:if="${tx.status.name() == 'FAILED'}" class="badge bg-danger">FAILED</span>
                        </td>
                        <td th:text="${tx.description}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transactions)}">
                        <td colspan="6" class="text-muted">No transactions found for this account.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
