<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bank Transfer Application</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4 text-primary">Bank Transfer Dashboard</h1>

    <!-- System Stats -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card bg-info text-white p-3">
                <h5>Total Customers</h5>
                <h3 th:text="${customerCount}">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white p-3">
                <h5>Total Balance</h5>
                <h3 th:text="'Rs. ' + ${totalBalance}">0.00</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-primary text-white p-3">
                <h5>Successful Transfers</h5>
                <h3 th:text="${successCount}">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-danger text-white p-3">
                <h5>Failed Transfers</h5>
                <h3 th:text="${failedCount}">0</h3>
            </div>
        </div>
    </div>

    <!-- Alerts for Transfer -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="row">
        <!-- Transfer Money Form -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-dark text-white">Transfer Money</div>
                <div class="card-body">
                    <form th:action="@{/transfer}" th:object="${transferRequest}" method="post">
                        <div class="mb-3">
                            <label>From Account:</label>
                            <input type="text" class="form-control" th:field="*{fromAccount}" required>
                        </div>
                        <div class="mb-3">
                            <label>To Account:</label>
                            <input type="text" class="form-control" th:field="*{toAccount}" required>
                        </div>
                        <div class="mb-3">
                            <label>Amount (Rs):</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{amount}" required>
                        </div>
                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input" th:field="*{simulateFailure}">
                            <label class="form-check-label text-danger">Simulate System Crash (For Testing)</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Money</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Add Customer Form -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-secondary text-white">Add New Customer</div>
                <div class="card-body">
                    <div th:if="${customerSuccess}" class="alert alert-success" th:text="${customerSuccess}"></div>
                    <div th:if="${customerError}" class="alert alert-danger" th:text="${customerError}"></div>
                    
                    <form th:action="@{/customers}" th:object="${newCustomer}" method="post">
                        <div class="mb-3">
                            <label>Account Number:</label>
                            <input type="text" class="form-control" th:field="*{accountNumber}" required>
                        </div>
                        <div class="mb-3">
                            <label>Full Name:</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>
                        <div class="mb-3">
                            <label>Email:</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>
                        <div class="mb-3">
                            <label>Initial Balance (Rs):</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{balance}" required>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Customers List -->
    <div class="card mt-4">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <span>Customer Accounts</span>
            <form th:action="@{/}" method="get" class="d-flex">
                <input type="text" name="keyword" class="form-control form-control-sm me-2" placeholder="Search by name...">
                <button type="submit" class="btn btn-sm btn-light">Search</button>
            </form>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Account No</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Balance (Rs)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="customer : ${customers}">
                        <td th:text="${customer.accountNumber}"></td>
                        <td th:text="${customer.fullName}"></td>
                        <td th:text="${customer.email}"></td>
                        <td th:text="${customer.balance}" class="fw-bold"></td>
                        <td>
                            <a th:href="@{/accounts/{acc}/history(acc=${customer.accountNumber})}" class="btn btn-sm btn-info">View History</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
